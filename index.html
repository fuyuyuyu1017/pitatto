<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぴたっと</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one full-screen canvas; the HUD sits on top. Single deliberate night-arcade look. */
:root {
  --bg: #14122b;
  --ink: #f3eedd;
  --dim: #8a86b3;
  --ring: #ffb84d;
  --grow: #6fd6ff;
  --perfect: #ffe066;
  --miss: #ff6b8a;
  --display: "DotGothic16", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--display);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
  display: flex; justify-content: space-between; align-items: baseline;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 18px; letter-spacing: .06em; font-variant-numeric: tabular-nums;
}
.hud .label { color: var(--dim); font-size: 13px; margin-right: 6px; }
@media (prefers-reduced-motion: reduce) { #game { filter: none; } }
</style>
</head>
<body>

<canvas id="game" aria-label="ぴたっと ゲーム画面"></canvas>
<div class="hud" aria-live="polite">
  <div><span class="label">ROUND</span><span id="round">-</span></div>
  <div><span class="label">SCORE</span><span id="score">0</span></div>
  <div><span class="label">BEST</span><span id="best">0</span></div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();
  const col = { ink: C('--ink'), dim: C('--dim'), ring: C('--ring'), grow: C('--grow'), perfect: C('--perfect'), miss: C('--miss'), bg: C('--bg') };
  const font = '"DotGothic16", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const ROUNDS = 5;
  // 判定は「最大半径に対するずれの割合」で決める（画面サイズに依存しない）
  const JUDGE = [
    { max: 0.015, name: 'PERFECT', pts: 100, color: 'perfect' },
    { max: 0.04,  name: 'GREAT',   pts: 70,  color: 'ring' },
    { max: 0.08,  name: 'GOOD',    pts: 40,  color: 'grow' },
  ];

  let W = 0, H = 0, maxR = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    maxR = Math.min(W, H) * 0.42;
  }
  addEventListener('resize', resize); resize();

  let best = 0;
  try { best = Number(localStorage.getItem('pitatto-best')) || 0; } catch (e) {}
  const $round = document.getElementById('round'), $score = document.getElementById('score'), $best = document.getElementById('best');
  $best.textContent = best;

  // state: 'title' | 'play' | 'judge' | 'result'
  let state = 'title', round = 0, score = 0, r = 0, target = 0, speed = 0, judge = null, judgeAt = 0, flash = 0, newBest = false;

  function startRound() {
    round++;
    target = 0.35 + Math.random() * 0.5;          // 目標の輪（最大半径に対する割合）
    speed = 0.45 + (round - 1) * 0.12;            // 1秒あたりに広がる割合。ラウンドごとに速くなる
    r = 0; judge = null; state = 'play';
    $round.textContent = round + '/' + ROUNDS;
  }
  function startGame() { round = 0; score = 0; newBest = false; $score.textContent = 0; startRound(); }

  function decide(diff, late) {
    const j = late ? null : JUDGE.find(j => diff <= j.max);
    judge = j ? { ...j, diff } : { name: late ? 'おそい！' : 'MISS', pts: 0, color: 'miss', diff };
    score += judge.pts; $score.textContent = score;
    judgeAt = performance.now(); flash = judge.pts === 100 ? 1 : judge.pts ? .5 : 0;
    state = 'judge';
    try { navigator.vibrate && navigator.vibrate(judge.pts === 100 ? [20, 40, 20] : 15); } catch (e) {}
  }

  function tap() {
    if (state === 'title') return startGame();
    if (state === 'play') return decide(Math.abs(r - target), false);
    if (state === 'judge' && performance.now() - judgeAt > 450) {
      if (round < ROUNDS) return startRound();
      state = 'result';
      if (score > best) { best = score; newBest = true; $best.textContent = best; try { localStorage.setItem('pitatto-best', best); } catch (e) {} }
      $round.textContent = '-';
      return;
    }
    if (state === 'result' && performance.now() - judgeAt > 900) return startGame();
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); } });

  function text(s, x, y, size, color, align = 'center') {
    ctx.font = `${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
  }
  function circle(rad, color, width, dash) {
    ctx.beginPath(); ctx.arc(W / 2, H / 2, Math.max(rad, 0), 0, Math.PI * 2);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    const cx = W / 2, cy = H / 2;
    ctx.fillStyle = col.bg; ctx.fillRect(0, 0, W, H);
    if (flash > 0 && !reduceMotion) { ctx.fillStyle = `rgba(255,224,102,${flash * 0.18})`; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 2.5); }

    // 最大範囲のガイド
    circle(maxR, col.dim, 1, [2, 8]);

    if (state === 'title') {
      const pulse = reduceMotion ? 0.6 : 0.5 + 0.5 * Math.sin(now / 400);
      circle(maxR * 0.6, col.ring, 4);
      circle(maxR * (0.2 + 0.4 * pulse), col.grow, 6);
      text('ぴたっと', cx, cy - maxR - 40 > 70 ? cy - maxR - 40 : cy - 30, Math.min(W * 0.14, 64), col.ink);
      text('広がる円を、輪にぴったり重ねて止めよう', cx, cy + maxR + 36, Math.min(W * 0.042, 18), col.dim);
      text('タップでスタート', cx, cy + maxR + 72, Math.min(W * 0.05, 22), col.ink);
    }

    if (state === 'play') {
      r += speed * dt;
      if (r > 1.0) { r = 1.0; decide(1, true); }
    }

    if (state === 'play' || state === 'judge') {
      circle(target * maxR, col.ring, 4);
      const c = state === 'judge' ? col[judge.color] : col.grow;
      circle(r * maxR, c, state === 'judge' ? 8 : 6);
      if (state === 'play') text('タップで止める', cx, cy + maxR + 40, Math.min(W * 0.045, 20), col.dim);
    }

    if (state === 'judge') {
      const t = Math.min((now - judgeAt) / 250, 1);
      const s = reduceMotion ? 1 : 0.6 + 0.4 * t;
      text(judge.name, cx, cy, Math.min(W * 0.13, 60) * s, col[judge.color]);
      if (judge.diff < 1) text('ずれ ' + (judge.diff * 100).toFixed(1) + '%' + (judge.pts ? '  +' + judge.pts : ''), cx, cy + Math.min(W * 0.11, 52), Math.min(W * 0.045, 20), col.ink);
      if (now - judgeAt > 450) text(round < ROUNDS ? 'タップで次へ' : 'タップで結果へ', cx, cy + maxR + 40, Math.min(W * 0.045, 20), col.dim);
    }

    if (state === 'result') {
      text('結果', cx, cy - 70, Math.min(W * 0.06, 26), col.dim);
      text(score + ' 点', cx, cy - 10, Math.min(W * 0.15, 72), col.ink);
      text('満点 ' + ROUNDS * 100 + ' 点', cx, cy + 46, Math.min(W * 0.042, 18), col.dim);
      if (newBest) text('ベスト更新！', cx, cy + 86, Math.min(W * 0.055, 24), col.perfect);
      if (now - judgeAt > 900) text('タップでもう一度', cx, cy + maxR + 40, Math.min(W * 0.05, 22), col.ink);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
})();
</script>
</body>
</html>
